# One customer helpdesk's Key Vault references: their status and, when a
# reference does not resolve, Azure's stated reason. Never a secret's value.
# With "fix" ticked, rewrites SESSION_SECRET and DATABASE_URL in the
# VaultName/SecretName form (what the portal sets today) - which also makes
# App Service look them up again.
name: Customer secrets

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: The customer's web app name
        required: true
        type: string
      vault_name:
        description: The Key Vault holding the helpdesk's secrets
        required: true
        type: string
      fix:
        description: Rewrite the two references (VaultName form)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: References
        env:
          APP: ${{ inputs.app_name }}
          VAULT: ${{ inputs.vault_name }}
          FIX: ${{ inputs.fix }}
        run: |
          [[ "$APP" =~ ^[a-z][a-z0-9-]{1,38}[a-z0-9]$ ]] || { echo "Invalid app name"; exit 1; }
          RG="helpdesk-$APP"
          SITE=$(az webapp show -g "$RG" -n "$APP" --query id -o tsv)
          show() {
            az rest --method get --url "https://management.azure.com$SITE/config/configreferences/appsettings?api-version=2023-12-01" \
              --query "value[].{setting:name, status:properties.status, reference:properties.reference, details:properties.details}" -o table
          }
          echo "== Before"; show
          if [ "$FIX" = "true" ]; then
            az webapp config appsettings set -g "$RG" -n "$APP" -o none --settings \
              "SESSION_SECRET=@Microsoft.KeyVault(VaultName=$VAULT;SecretName=$APP-session-secret)" \
              "DATABASE_URL=@Microsoft.KeyVault(VaultName=$VAULT;SecretName=$APP-database-url)"
            echo "Rewritten; waiting a minute for App Service to look them up."
            sleep 60
            echo "== After"; show
          fi
          echo "== The web app's identity"
          az webapp identity show -g "$RG" -n "$APP" --query "{principalId:principalId, type:type}" -o table
