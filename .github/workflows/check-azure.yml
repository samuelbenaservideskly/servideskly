# Signs in to Azure the way the deploy workflows do, and lists what the
# identity can see - nothing is changed. Run it after touching the app
# registration, its federated credentials or its role assignments.
name: Check Azure sign-in

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What this identity can see
        run: |
          az account show --query "{subscription:name, id:id, tenant:tenantId}" -o table
          echo "Resource groups:"
          az group list --query "[].name" -o tsv
          echo "Role assignments:"
          az role assignment list --assignee "${{ vars.AZURE_CLIENT_ID }}" --all --query "[].{role:roleDefinitionName, scope:scope}" -o table
