# Makes a commit of main the production release.
#
# The branch `production` moves forward to the chosen commit (by default the
# head of `main`) - only forward, along main's history, so it
# never takes a commit that is not on main. Customers are not
# redeployed by this: each one moves when "Deploy to a customer" is run for
# it - from the portal, or by hand.
#
# Tests must pass on the commit before it reaches production. It is then
# built once, as the package every customer deploy copies in
# (helpdesk-<commit>.zip on the release "builds", the latest ten kept);
# deploy-customer.yml builds for itself only when there is none. Running
# this again for the commit production is already on just makes the package.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit of main to promote (empty - the head of main)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: promote-release

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Which commit
        id: pick
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          target="${COMMIT:-$(git rev-parse HEAD)}"
          git cat-file -e "$target^{commit}" || { echo "::error::No such commit"; exit 1; }
          sha=$(git rev-parse "$target")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Node 24, as the web apps run: the package below carries
      # better-sqlite3 compiled by this Node, and another version's build
      # would not load there.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Test it
        run: |
          git checkout --quiet ${{ steps.pick.outputs.sha }}
          npm ci
          npm run verify

      # The same Node version as the web apps: better-sqlite3 is native.
      # Exactly what deploy-customer.yml would build, in the same shape.
      - name: Build the package
        run: |
          npm run build
          npm ci --omit=dev
          echo "production $(git rev-parse --short HEAD)" > RELEASE
          # src/i18n/strings.json is read at start-up (src/i18n/index.ts): without
          # it the helpdesk stops at once - which it did, 17 Oct 2026.
          zip -qr "helpdesk-${{ steps.pick.outputs.sha }}.zip" dist node_modules views public package.json RELEASE src/i18n/strings.json

      # The package must start on its own before it is published: unpacked in
      # an empty folder, run as a web app would run it, until /readyz answers.
      # A file missing from the zip then stops the promotion, not a customer.
      - name: Start the package
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && unzip -q "helpdesk-${{ steps.pick.outputs.sha }}.zip" -d /tmp/pkg
          cd /tmp/pkg
          PORT=3999 APP_BASE_URL=http://localhost:3999 DATABASE_PATH=/tmp/pkg-smoke.sqlite UPLOAD_DIR=/tmp/pkg-uploads node dist/server.js > /tmp/pkg.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3999/readyz >/dev/null; then echo "The package starts and answers."; kill %1; exit 0; fi
            sleep 1
          done
          echo "::error::The package did not start"; cat /tmp/pkg.log; exit 1

      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          gh release view builds >/dev/null 2>&1 || gh release create builds --target "$SHA" --title "Builds" --notes "Ready-made packages of production, one per promoted commit. Used by Deploy to a customer."
          gh release upload builds "helpdesk-$SHA.zip" --clobber
          # Keep the ten newest.
          gh release view builds --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[10:] | .[].name' |
            while read -r old; do gh release delete-asset builds "$old" --yes; done

      - name: Move production
        # A plain push: GitHub refuses one that is not a fast-forward, so
        # production cannot be moved back or sideways by this workflow.
        run: git push origin ${{ steps.pick.outputs.sha }}:refs/heads/production

      - name: Summary
        run: echo "production -> $(git rev-parse --short ${{ steps.pick.outputs.sha }}), package helpdesk-${{ steps.pick.outputs.sha }}.zip" >> "$GITHUB_STEP_SUMMARY"
