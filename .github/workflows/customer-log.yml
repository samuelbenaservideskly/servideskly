# Prints the end of one customer helpdesk's own log - start-up, migrations,
# errors. Read-only; run from the Actions tab with the customer's app name.
name: Customer log

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: The customer's web app name
        required: true
        type: string
      lines:
        description: How many lines
        required: false
        default: "150"

permissions:
  id-token: write
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: The web app's log
        env:
          APP: ${{ inputs.app_name }}
          LINES: ${{ inputs.lines }}
        run: |
          [[ "$APP" =~ ^[a-z][a-z0-9-]{1,38}[a-z0-9]$ ]] || { echo "Invalid app name"; exit 1; }
          az webapp log download -g "helpdesk-$APP" -n "$APP" --log-file logs.zip
          unzip -qo logs.zip -d logs
          echo "Files:"; find logs -type f -name "*.log" | head -30
          # The app's own output (default_docker), else the platform's (docker).
          for f in $(find logs -type f \( -name "*default_docker.log" -o -name "*_docker.log" \) | xargs -r ls -t | head -3); do
            echo "=== $f"; tail -n "${LINES:-150}" "$f"
          done
